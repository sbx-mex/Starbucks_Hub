name: Auditar y limpiar obsoletos

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: write

concurrency:
  group: cleanup-obsolete-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Limpiar únicamente residuos autorizados
        run: python scripts/audit_obsolete.py --fix

      - name: Validar experiencia y estructura
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tests/validate_project.py

      - name: Publicar limpieza validada
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No hay obsoletos por retirar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: limpiar recursos obsoletos validados"
          git push
