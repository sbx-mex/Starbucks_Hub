name: Auditar y limpiar obsoletos

on:
  push:
    branches: [main]
    paths:
      - 'Starbucks_Hub_CMS.xlsx'
      - 'scripts/build_cms.py'
      - 'tests/validate_project.py'
      - '.github/workflows/cleanup-obsolete.yml'
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: write

concurrency:
  group: cleanup-obsolete-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstruir datos desde el CMS
        run: python scripts/build_cms.py Starbucks_Hub_CMS.xlsx data/cms.json

      - name: Validar CMS y PWA
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tests/validate_project.py

      - name: Publicar solo el JSON generado por el CMS
        shell: bash
        run: |
          if git diff --quiet -- data/cms.json; then
            echo "El CMS no produjo cambios de datos."
            exit 0
          fi
          git add data/cms.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: sincronizar CMS"
          git push

      - name: Auditar y retirar solo residuos seguros
        run: python scripts/audit_obsolete.py --fix --report "$RUNNER_TEMP/obsolete-report.json"

      - name: Validar PWA después de la limpieza
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python tests/validate_project.py

      - name: Guardar reporte de mantenimiento
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obsolete-audit-${{ github.run_number }}
          path: ${{ runner.temp }}/obsolete-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Publicar únicamente eliminaciones validadas
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No hay obsoletos seguros por retirar."
            exit 0
          fi

          git add -u
          if git diff --cached --name-status | grep -Ev '^D[[:space:]]' | grep -q .; then
            echo "La auditoría intentó modificar algo distinto de una eliminación. Se cancela."
            git diff --cached --name-status
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: retirar residuos obsoletos validados"
          git push
