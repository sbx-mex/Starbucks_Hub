name: Auditar y limpiar obsoletos

on:
  push:
    branches: [main]
    paths:
      - 'Starbucks_Hub_CMS.xlsx'
      - 'BORRAR_EN_GITHUB.txt'
      - 'scripts/build_cms.py'
      - 'scripts/audit_cms.py'
      - 'scripts/audit_obsolete.py'
      - 'tests/validate_project.py'
      - 'app.js'
      - 'styles.css'
      - 'index.html'
      - 'INSTRUCCIONES_ACTUALIZACION.md'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'service-worker.js'
      - 'data/dashboard.json'
      - 'requirements.txt'
      - 'scripts/audit_project.py'
      - 'scripts/build_dashboard.py'
      - 'scripts/prepare_images.py'
      - 'assets/dm/**'
      - 'assets/icons/icon-192.*'
      - 'assets/icons/icon-512.*'
      - 'assets/icons/icon-64.*'
      - 'assets/icons/ops-logo.webp'
      - 'cms/**'
      - 'INSTRUCCIONES.md'
      - 'VALIDACION.txt'
      - 'VALIDACION_RESTAURACION.txt'
      - 'assets/icons/starbucks_hub.png'
      - '.github/workflows/cleanup-obsolete.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'

permissions:
  contents: write

concurrency:
  group: cleanup-obsolete-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUNBUFFERED: '1'

jobs:
  cleanup:
    name: Validación y limpieza controlada
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python estable
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verificar sintaxis Python
        run: python -m compileall -q scripts tests

      - name: Reconstruir JSON desde el CMS
        run: python scripts/build_cms.py Starbucks_Hub_CMS.xlsx data/cms.json

      - name: Auditar encabezados y navegación CMS
        run: >-
          python scripts/audit_cms.py
          --strict
          --report "$RUNNER_TEMP/cms-report.json"

      - name: Auditar antes de modificar
        run: >-
          python scripts/audit_obsolete.py
          --manifest BORRAR_EN_GITHUB.txt
          --report "$RUNNER_TEMP/pre-cleanup-report.json"

      - name: Eliminar únicamente rutas autorizadas
        run: >-
          python scripts/audit_obsolete.py
          --manifest BORRAR_EN_GITHUB.txt
          --fix
          --report "$RUNNER_TEMP/cleanup-report.json"

      - name: Confirmar limpieza y rendimiento
        run: >-
          python scripts/audit_obsolete.py
          --manifest BORRAR_EN_GITHUB.txt
          --strict
          --strict-performance
          --report "$RUNNER_TEMP/post-cleanup-report.json"

      - name: Validar CMS interfaz y PWA
        run: python tests/validate_project.py

      - name: Guardar reportes Python
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mantenimiento-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/pre-cleanup-report.json
            ${{ runner.temp }}/cleanup-report.json
            ${{ runner.temp }}/post-cleanup-report.json
            ${{ runner.temp }}/cms-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Publicar solo JSON y eliminaciones validadas
        shell: bash
        run: |
          git add data/cms.json
          git add -u

          if git diff --cached --quiet; then
            echo 'El repositorio ya está limpio y sincronizado.'
            exit 0
          fi

          python - <<'PY'
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          allowed_deletions = {
              line.strip().replace('\\', '/').removeprefix('./')
              for line in (root / 'BORRAR_EN_GITHUB.txt').read_text(encoding='utf-8-sig').splitlines()
              if line.strip() and not line.lstrip().startswith('#')
          }
          output = subprocess.check_output(
              ['git', 'diff', '--cached', '--name-status'], text=True, encoding='utf-8'
          )
          errors = []
          for row in output.splitlines():
              status, path = row.split('\t', 1)
              valid_json = status == 'M' and path == 'data/cms.json'
              valid_deletion = status == 'D' and path in allowed_deletions
              if not (valid_json or valid_deletion):
                  errors.append(row)
          if errors:
              raise SystemExit('Cambios no autorizados:\n' + '\n'.join(errors))
          print('Política de cambios aprobada:\n' + output)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: sincronizar CMS y limpiar obsoletos validados'
          git pull --rebase origin main
          git push origin HEAD:main
